services:
  daily-report-worker:
    image: ${ADMIN_HUB_IMAGE}
    command: ["node", "dist/dailyReportWorkerEntrypoint.js"]
    restart: "no"
    environment:
      DAILY_REPORT_WORKER_ENABLED: ${DAILY_REPORT_WORKER_ENABLED}
      DAILY_REPORT_SCHEDULE: ${DAILY_REPORT_SCHEDULE}
      DAILY_REPORT_TIMEZONE: ${DAILY_REPORT_TIMEZONE}
      DAILY_REPORT_RECIPIENT: ${DAILY_REPORT_RECIPIENT}
      DAILY_REPORT_PROVIDER_ADAPTER: ${DAILY_REPORT_PROVIDER_ADAPTER}
      DAILY_REPORT_MAX_ATTEMPTS: ${DAILY_REPORT_MAX_ATTEMPTS}
      DAILY_REPORT_BACKOFF_SECONDS: ${DAILY_REPORT_BACKOFF_SECONDS}
      DAILY_REPORT_LEASE_SECONDS: ${DAILY_REPORT_LEASE_SECONDS}
      DAILY_REPORT_QUEUE_DATABASE_URL: ${DAILY_REPORT_QUEUE_DATABASE_URL}
      DAILY_REPORT_SCHEDULED_FOR: ${DAILY_REPORT_SCHEDULED_FOR}
      DAILY_REPORT_RUN_ID: ${DAILY_REPORT_RUN_ID}
